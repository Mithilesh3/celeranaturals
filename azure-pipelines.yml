trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: none

  - task: SSH@0
    displayName: 'Deploy Celeranaturals to Azure VM'
    inputs:
      sshEndpoint: 'CeleraAzureVM'
      runOptions: 'inline'
      readyTimeout: '20000'
      inline: |
        set -eu

        APP_DIR="/home/azureuser/apps/celeranaturals"
        APP_NAME="celeranaturals"
        APP_PORT="3002"

        cd "$APP_DIR"

        echo "Fetching latest code..."
        git fetch origin main
        git reset --hard origin/main

        echo "Preparing pnpm..."
        corepack enable
        corepack prepare pnpm@12.11.2 --activate

        echo "Installing dependencies..."
        pnpm install --frozen-lockfile

        echo "Checking TypeScript..."
        pnpm run typecheck

        echo "Building Next.js..."
        pnpm run build

        echo "Starting or restarting application..."

        if pm2 describe "$APP_NAME" >/dev/null 2>&1; then
          pm2 restart "$APP_NAME" --update-env
        else
          pm2 start node_modules/next/dist/bin/next \
            --name "$APP_NAME" \
            -- start -H 0.0.0.0 -p "$APP_PORT"
        fi

        pm2 save

        echo "Checking website health..."
        ATTEMPTS=12

        for i in $(seq 1 "$ATTEMPTS"); do
          if curl --connect-timeout 3 -fsS \
            "http://127.0.0.1:${APP_PORT}/" \
            -o /dev/null; then
            echo "Website health check passed."
            break
          fi

          if [ "$i" -eq "$ATTEMPTS" ]; then
            echo "ERROR: Website health check failed."
            pm2 status
            pm2 logs "$APP_NAME" --err --lines 50 --nostream || true
            exit 1
          fi

          echo "Attempt $i/$ATTEMPTS failed; waiting..."
          sleep 5
        done

        echo "Deployment completed successfully."
