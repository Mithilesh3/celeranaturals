<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contact Celeranaturals customer support and wellness team." />
    <title>Contact Us | Celeranaturals</title>
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body data-page="contact">
    <div id="site-header"></div>
    <main>
      <section class="page-hero">
        <div class="container">
          <nav class="breadcrumb" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><span>Contact</span></nav>
          <h1 class="section-title">Need product or delivery support?</h1>
          <p class="section-sub">Reach the Celeranaturals support team for order status, shipping queries and product-related assistance.</p>
        </div>
      </section>
      <section class="section page-tight-top">
        <div class="container contact-layout">
          <div>
            <form class="contact-box" id="contact-form">
              <h3 class="contact-title">Send Us a Message</h3>
              <label for="name">Full Name</label>
              <input id="name" class="input" required />
              <label for="email" class="field-label">Email</label>
              <input id="email" type="email" class="input" required />
              <label for="message" class="field-label">Message</label>
              <textarea id="message" rows="5" required></textarea>
              <button class="btn btn-primary form-submit" type="submit">Submit</button>
            </form>
            <div class="map-placeholder map-gap">Lucknow, Uttar Pradesh Service Region</div>
          </div>
          <div id="contact-meta"></div>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script type="module" src="scripts/app.js"></script>
  </body>
</html>
